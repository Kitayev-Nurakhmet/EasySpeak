<!DOCTYPE html>
<html lang="ru">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Easy Speak - школа иностранных языков</title>
</head>

<body>
 <header class="header">
  <div class="container">
   <img class="header__img" src="image/logo.svg" alt="Логотип компании Easy Speak">

   <a class="header__link" href="tel:+79148748448">+7(914)874-84-48</a>
  </div>
 </header>

 <main>
  <section class="hero">
   <div class="container">
    <div class="hero__content">
     <h1 class="hero__title">Online-школа <span class="hero__subtitle">иностранных языков</span></h1>

     <div class="hero__description">
      <p class="hero__text">Научиться новому&nbsp;&mdash; легко!</p>
      <p class="hero__text">Поможем преодолеть языковой барьер уже за&nbsp;3&nbsp;месяца обучения</p>
     </div>

     <button class="hero__button">Записаться на пробный урок</button>

     <ul class="hero__languages">
      <li class="hero__language">Английский</li>
      <li class="hero__language">Французский</li>
      <li class="hero__language">Китайский</li>
      <li class="hero__language">Испанский</li>
      <li class="hero__language">Итальянский</li>
      <li class="hero__language">Немецкий</li>
     </ul>
    </div>

    <figure class="hero__girl">
     <img class="hero__girl-img" src="image/girl.png" alt="Девушка с ноутбуком">
    </figure>

   </div>
  </section>
 </main>
</body>

</html>
