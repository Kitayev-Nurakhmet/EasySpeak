<!DOCTYPE html>
<html lang="ru">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="css/normalize.css">
 <link rel="stylesheet" href="css/style.css">
 <title>Easy Speak - школа иностранных языков</title>
</head>

<body>
 <header class="header">
  <div class="container header__container">
   <img class="header__logo" src="image/logo.svg" alt="Логотип компании Easy Speak">

   <a class="header__phone" href="tel:+79148748448">+7(914)874-84-48</a>
  </div>
 </header>

 <main>
  <section class="hero">
   <div class="container hero__container">
    <div class="hero__content">
     <h1 class="hero__title"><strong class="hero__title-strong">Online-школа</strong>
      <span class="hero__subtitle">иностранных языков</span>
     </h1>

     <div class="hero__description">
      <p class="hero__text">Научиться новому&nbsp;&mdash; легко!</p>
      <p class="hero__text">Поможем преодолеть языковой барьер уже&nbsp;за&nbsp;3&nbsp;месяца обучения</p>
     </div>

     <button class="hero__button">Записаться на пробный урок</button>

     <ul class="hero__languages">
      <li class="hero__language hero__language_yellow">Английский</li>
      <li class="hero__language hero__language_blue">Французский</li>
      <li class="hero__language hero__language_red">Китайский</li>
      <li class="hero__language hero__language_pink">Испанский</li>
      <li class="hero__language hero__language_powder">Итальянский</li>
      <li class="hero__language hero__language_green">Немецкий</li>
     </ul>
    </div>

   </div>
  </section>
 </main>
</body>

</html>
